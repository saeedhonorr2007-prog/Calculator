
name: Build Calculator APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CalculatorAndroidProject.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: unzip -q CalculatorAndroidProject.zip -d extracted

      - name: Build APK
        working-directory: extracted/CalculatorAndroidProject
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-APK
          path: extracted/CalculatorAndroidProject/app/build/outputs/apk/debug/app-debug.apk
